    <text x="28" y="52" class="label">2B — teal signal</text>
    <text x="28" y="82" class="sub">lavender D, teal R, off-white T</text>
    <g transform="translate(44 82)" filter="url(#softGlow)">
      <path class="shadow" d="M296 92h102q53 0 86 34t33 88v78q0 54-33 88t-86 34H296v-62h86q28 0 46-18t18-47v-68q0-29-18-47t-46-18h-86z"/>
      <path fill="#c084fc" d="M280 78h102q53 0 86 34t33 88v78q0 54-33 88t-86 34H280v-62h86q28 0 46-18t18-47v-68q0-29-18-47t-46-18h-86z"/>
      <path class="shadow" d="M96 158h139q32 0 52 19t20 50v49q0 31-20 50t-52 19h-36l70 69h-81l-90-91v-55h108q16 0 26-9t10-25q0-16-10-25t-26-9H96z"/>
      <path fill="#2dd4bf" d="M80 144h139q32 0 52 19t20 50v49q0 31-20 50t-52 19h-36l70 69h-81l-90-91v-55h108q16 0 26-9t10-25q0-16-10-25t-26-9H80z"/>
      <path fill="#fff7f0" d="M80 78h310v58H266v264h-68V136H80z"/>
      <rect x="198" y="364" width="68" height="36" rx="9" fill="#b8f34a"/>
    </g>
  </g>

