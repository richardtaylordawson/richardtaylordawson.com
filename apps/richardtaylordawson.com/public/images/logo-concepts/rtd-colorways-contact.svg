<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1810" viewBox="0 0 1240 1810" role="img" aria-labelledby="title desc">
  <title id="title">RTD logo colorway contact sheet</title>
  <desc id="desc">Six RTD monogram logo colorways using the site's plum, lavender, off-white, teal, and lime palette.</desc>
  <defs>
    <style>
      .label { fill: #c2b4c9; font: 600 28px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .01em; }
      .sub { fill: #8f7c99; font: 500 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .panel { fill: #140c1c; stroke: #35213f; stroke-width: 2; }
      .shadow { fill: #0c0711; opacity: .42; }
    </style>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.75 0 0 0 0.75  0 0.35 0 0 0.25  0 0 0.95 0 1  0 0 0 .35 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1240" height="1810" fill="#0f0716"/>
  <text x="80" y="78" class="label" style="font-size:42px;fill:#fff7f0">RTD logo colorways</text>
  <text x="80" y="114" class="sub">Selected concepts 1, 2, and 5; tuned to #140c1c, #fff7f0, #c084fc, #2dd4bf, and #b8f34a.</text>

  <!-- Concept 1 / site primary -->
  <g transform="translate(80 160)">
    <rect class="panel" width="520" height="470" rx="34"/>
    <text x="28" y="52" class="label">1A — site primary</text>
    <text x="28" y="82" class="sub">off-white + lavender, restrained lime</text>
    <g transform="translate(35 72)" filter="url(#softGlow)">
      <path class="shadow" d="M82 125h142q41 0 68 28t27 70v105h-64v-94q0-23-15-37t-39-14H145v95h98v54h-98v99H82V125z"/>
      <path fill="#fff7f0" d="M66 112h142q41 0 68 28t27 70v105h-64v-94q0-23-15-37t-39-14H129v95h98v54h-98v99H66V112z"/>
      <path fill="#c084fc" opacity=".8" d="M129 265h74q20 0 20 19v35h-56l69 99h-76l-58-99h27z"/>
      <path class="shadow" d="M286 125h132q43 0 71 28t28 70v95q0 42-28 70t-71 28H286v-64h117q24 0 38-15t14-39v-55q0-24-14-39t-38-15H286z"/>
      <path fill="#fff7f0" d="M270 112h132q43 0 71 28t28 70v95q0 42-28 70t-71 28H270v-64h117q24 0 38-15t14-39v-55q0-24-14-39t-38-15H270z"/>
      <path fill="#c084fc" d="M178 202h208v53h-77v163h-62V255h-69z"/>
      <rect x="247" y="382" width="62" height="36" rx="9" fill="#b8f34a"/>
    </g>
  </g>

  <!-- Concept 1 / teal signal -->
  <g transform="translate(640 160)">
    <rect class="panel" width="520" height="470" rx="34"/>
    <text x="28" y="52" class="label">1B — teal signal</text>
    <text x="28" y="82" class="sub">lavender structure, teal T, tiny lime</text>
    <g transform="translate(35 72)" filter="url(#softGlow)">
      <path class="shadow" d="M82 125h142q41 0 68 28t27 70v105h-64v-94q0-23-15-37t-39-14H145v95h98v54h-98v99H82V125z"/>
      <path fill="#c084fc" d="M66 112h142q41 0 68 28t27 70v105h-64v-94q0-23-15-37t-39-14H129v95h98v54h-98v99H66V112z"/>
      <path fill="#fff7f0" opacity=".82" d="M129 265h74q20 0 20 19v35h-56l69 99h-76l-58-99h27z"/>
      <path class="shadow" d="M286 125h132q43 0 71 28t28 70v95q0 42-28 70t-71 28H286v-64h117q24 0 38-15t14-39v-55q0-24-14-39t-38-15H286z"/>
