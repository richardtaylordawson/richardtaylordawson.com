    <g transform="translate(48 86)" filter="url(#softGlow)">
      <path class="shadow" d="M85 125h122q42 0 68 25t26 66v30q0 41-26 66t-68 25h-38l66 77h-78l-76-91v-53h104q21 0 34-12t13-32q0-20-13-32t-34-12H85z"/>
      <path fill="#c084fc" d="M69 111h122q42 0 68 25t26 66v30q0 41-26 66t-68 25h-38l66 77h-78l-76-91v-53h104q21 0 34-12t13-32q0-20-13-32t-34-12H69z"/>
      <path class="shadow" d="M306 125h103q51 0 84 33t33 84v72q0 52-33 84t-84 32H306v-62h85q28 0 45-17t17-45v-56q0-28-17-45t-45-17h-85z"/>
      <path fill="#c084fc" d="M290 111h103q51 0 84 33t33 84v72q0 52-33 84t-84 32H290v-62h85q28 0 45-17t17-45v-56q0-28-17-45t-45-17h-85z"/>
      <path fill="#fff7f0" d="M86 74h337v56H289v286h-68V130H86z"/>
      <path fill="#c084fc" d="M221 130h68v286h-68z"/>
      <rect x="221" y="380" width="68" height="36" rx="9" fill="#b8f34a"/>
    </g>
  </g>

  <!-- Concept 5 / teal signal -->
  <g transform="translate(640 1220)">
    <rect class="panel" width="520" height="470" rx="34"/>
    <text x="28" y="52" class="label">5B — teal signal</text>
    <text x="28" y="82" class="sub">lavender R/D, teal spine, cream crossbar</text>
    <g transform="translate(48 86)" filter="url(#softGlow)">
      <path class="shadow" d="M85 125h122q42 0 68 25t26 66v30q0 41-26 66t-68 25h-38l66 77h-78l-76-91v-53h104q21 0 34-12t13-32q0-20-13-32t-34-12H85z"/>
      <path fill="#c084fc" d="M69 111h122q42 0 68 25t26 66v30q0 41-26 66t-68 25h-38l66 77h-78l-76-91v-53h104q21 0 34-12t13-32q0-20-13-32t-34-12H69z"/>
      <path class="shadow" d="M306 125h103q51 0 84 33t33 84v72q0 52-33 84t-84 32H306v-62h85q28 0 45-17t17-45v-56q0-28-17-45t-45-17h-85z"/>
      <path fill="#c084fc" d="M290 111h103q51 0 84 33t33 84v72q0 52-33 84t-84 32H290v-62h85q28 0 45-17t17-45v-56q0-28-17-45t-45-17h-85z"/>
      <path fill="#fff7f0" d="M86 74h337v56H289v55h-68v-55H86z"/>
      <path fill="#2dd4bf" d="M221 130h68v286h-68z"/>
      <rect x="221" y="380" width="68" height="36" rx="9" fill="#b8f34a"/>
